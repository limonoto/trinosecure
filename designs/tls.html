<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TLS / HTTPS · Trino-Secure</title>
<script>document.documentElement.classList.toggle('dark',(localStorage.getItem('ts-theme')||'dark')==='dark');</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tw.js"></script>
<link rel="stylesheet" href="assets/theme.css" />
</head>
<body>
<template id="page">
  <div class="mx-auto max-w-[860px] px-4 py-6 md:px-6 md:py-8">
    <div id="head"></div>

    <!-- master switch -->
    <div class="card mt-6 flex items-center gap-4 p-5">
      <span class="flex h-11 w-11 flex-none items-center justify-center rounded-lg bg-success/12 text-success [&>svg]:w-6 [&>svg]:h-6" id="lock"></span>
      <div class="flex-1">
        <div class="flex items-center gap-2"><h2 class="text-[15px] font-semibold">HTTPS enabled</h2><span class="badge badge-success" id="onbadge"></span></div>
        <p class="mt-0.5 text-[13px] text-muted-foreground">Coordinator is serving TLS on <span class="mono">:8443</span>. HTTP on <span class="mono">:8080</span> redirects to HTTPS.</p>
      </div>
      <button class="switch" role="switch" aria-checked="true" id="master"></button>
    </div>

    <div class="mt-6 space-y-4" id="cfg">
      <section class="card p-5">
        <h3 class="text-[13px] font-semibold">Server certificate</h3>
        <div class="mt-3 flex items-center gap-3 rounded-md border border-border p-3">
          <span class="flex h-8 w-8 items-center justify-center rounded-md bg-primary/12 text-primary [&>svg]:w-4 [&>svg]:h-4" id="ci"></span>
          <div class="flex-1"><div class="text-[13px] font-medium">coordinator-https</div><div class="text-[11px] text-muted-foreground mono">CN=*.trino.prod.internal · expires Jul 4, 2026</div></div>
          <span class="badge badge-warning" id="expb"></span>
          <button class="btn btn-outline btn-sm" id="choose">Change</button>
        </div>
      </section>

      <section class="card p-5">
        <h3 class="text-[13px] font-semibold">Protocol &amp; ciphers</h3>
        <div class="mt-3 space-y-3">
          <div class="flex items-center justify-between"><div><p class="text-[13px] font-medium">Minimum TLS version</p><p class="text-[12px] text-muted-foreground">Reject older handshakes</p></div><select class="input w-auto"><option>TLS 1.3</option><option selected>TLS 1.2</option></select></div>
          <div class="flex items-center justify-between border-t border-border pt-3"><div><p class="text-[13px] font-medium">HTTP → HTTPS redirect</p><p class="text-[12px] text-muted-foreground">Force secure connections</p></div><button class="switch" role="switch" aria-checked="true"></button></div>
          <div class="flex items-center justify-between border-t border-border pt-3"><div><p class="text-[13px] font-medium">HSTS</p><p class="text-[12px] text-muted-foreground">Strict-Transport-Security · 1 year</p></div><button class="switch" role="switch" aria-checked="true"></button></div>
          <div class="flex items-center justify-between border-t border-border pt-3"><div><p class="text-[13px] font-medium">Mutual TLS (client certs)</p><p class="text-[12px] text-muted-foreground">Require client certificate auth</p></div><button class="switch" role="switch" aria-checked="false"></button></div>
        </div>
      </section>

      <section class="card p-5">
        <h3 class="text-[13px] font-semibold">Internal communication</h3>
        <p class="mt-1 text-[12px] text-muted-foreground">TLS between coordinator and workers.</p>
        <div class="mt-3 flex items-center justify-between"><div><p class="text-[13px] font-medium">Encrypt internal traffic</p><p class="text-[12px] text-muted-foreground">internal-communication.https.required</p></div><button class="switch" role="switch" aria-checked="true"></button></div>
      </section>
    </div>

    <div class="mt-6 flex items-center justify-end gap-2">
      <button class="btn btn-outline" id="test">Test handshake</button>
      <button class="btn btn-primary" id="save">Save &amp; reload</button>
    </div>
  </div>
</template>
<script>window.PAGE = { id: 'tls', title: 'TLS / HTTPS' };</script>
<script src="assets/shell.js"></script>
<script>
(function () {
  var I = Shell.icon;
  document.getElementById('lock').innerHTML = I('lock'); document.getElementById('ci').innerHTML = I('cert');
  document.getElementById('onbadge').innerHTML = I('check') + 'On'; document.getElementById('expb').innerHTML = I('alert') + '19 days';
  document.getElementById('head').innerHTML = Shell.ui.pageHeader({ title: 'TLS / HTTPS', subtitle: 'Encryption for client connections and internal cluster traffic.' });

  document.querySelectorAll('.switch').forEach(function (sw) { sw.addEventListener('click', function () { var on = sw.getAttribute('aria-checked') === 'true'; sw.setAttribute('aria-checked', !on); }); });
  document.getElementById('master').addEventListener('click', function () {
    var on = this.getAttribute('aria-checked') === 'true';
    document.getElementById('cfg').style.opacity = on ? '.4' : '1';
    document.getElementById('cfg').style.pointerEvents = on ? 'none' : '';
    Shell.toast({ title: on ? 'HTTPS disabled' : 'HTTPS enabled', tone: on ? 'warning' : 'success' });
  });
  document.getElementById('choose').addEventListener('click', function () { window.location.href = 'certificates.html'; });
  document.getElementById('test').addEventListener('click', function () { var b = this; b.disabled = true; b.textContent = 'Testing…'; setTimeout(function () { b.disabled = false; b.textContent = 'Test handshake'; Shell.toast({ title: 'Handshake OK', desc: 'TLS 1.2 · ECDHE-RSA-AES256-GCM-SHA384', tone: 'success' }); }, 1100); });
  document.getElementById('save').addEventListener('click', function () { Shell.confirm({ title: 'Save and reload TLS config?', tone: 'warning', icon: 'lock', okText: 'Save & reload', subtitle: 'The coordinator will reload its HTTPS connector. Active connections may briefly drop.', onConfirm: function () { Shell.toast({ title: 'TLS configuration saved', desc: 'Connector reloaded on :8443', tone: 'success' }); } }); });
})();
</script>
</body>
</html>
