<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>App Settings · Trino-Secure</title>
<script>document.documentElement.classList.toggle('dark',(localStorage.getItem('ts-theme')||'dark')==='dark');</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tw.js"></script>
<link rel="stylesheet" href="assets/theme.css" />
</head>
<body>
<template id="page">
  <div class="mx-auto max-w-[760px] px-4 py-6 md:px-6 md:py-8">
    <div id="head"></div>

    <section class="card mt-6 p-5">
      <h2 class="text-sm font-semibold">Profile</h2>
      <div class="mt-4 flex items-center gap-4">
        <span class="flex h-14 w-14 items-center justify-center rounded-full bg-primary/12 text-primary text-lg font-semibold">AR</span>
        <div class="flex-1"><div class="text-[15px] font-semibold">Ava Reyes</div><div class="text-[13px] text-muted-foreground"><a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="5a3b2c3b74283f233f291a3935282a7433342e3f28343b36">[email&#160;protected]</a></div></div>
        <span class="badge badge-primary">Security Admin</span>
      </div>
      <p class="mt-3 text-[12px] text-muted-foreground flex items-center gap-1.5"><span class="[&>svg]:w-4 [&>svg]:h-4" id="ki"></span>Signed in via Keycloak (OIDC). Profile is managed in your identity provider.</p>
    </section>

    <section class="card mt-4 p-5">
      <h2 class="text-sm font-semibold">Appearance</h2>
      <div class="mt-4 space-y-4">
        <div class="flex items-center justify-between"><div><p class="text-[13px] font-medium">Theme</p><p class="text-[12px] text-muted-foreground">Used across the console</p></div>
          <div class="seg" id="theme"><button data-th="light">Light</button><button data-th="dark">Dark</button><button data-th="system">System</button></div></div>
        <div class="flex items-center justify-between border-t border-border pt-4"><div><p class="text-[13px] font-medium">Language</p><p class="text-[12px] text-muted-foreground">Interface language</p></div>
          <select class="input w-auto"><option>English (US)</option><option>Türkçe</option><option>Deutsch</option><option>日本語</option></select></div>
        <div class="flex items-center justify-between border-t border-border pt-4"><div><p class="text-[13px] font-medium">Density</p><p class="text-[12px] text-muted-foreground">Table row height</p></div>
          <div class="seg"><button aria-selected="true">Comfortable</button><button aria-selected="false">Compact</button></div></div>
      </div>
    </section>

    <section class="card mt-4 p-5">
      <h2 class="text-sm font-semibold">Notifications</h2>
      <div class="mt-4 space-y-3" id="notif"></div>
    </section>

    <section class="card mt-4 p-5">
      <h2 class="text-sm font-semibold">Safety</h2>
      <div class="mt-4 space-y-3">
        <div class="flex items-center justify-between"><div><p class="text-[13px] font-medium">Require confirmation to publish to Production</p><p class="text-[12px] text-muted-foreground">Always show the publish review dialog</p></div><button class="switch" role="switch" aria-checked="true"></button></div>
        <div class="flex items-center justify-between border-t border-border pt-3"><div><p class="text-[13px] font-medium">Block publish on validation errors</p><p class="text-[12px] text-muted-foreground">Prevent deploying invalid rules</p></div><button class="switch" role="switch" aria-checked="true"></button></div>
      </div>
    </section>

    <div class="mt-6 flex items-center justify-between">
      <button class="btn btn-ghost text-destructive" id="logout" data-i="logout">Sign out</button>
      <button class="btn btn-primary" id="save">Save changes</button>
    </div>
  </div>
</template>
<script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>window.PAGE = { id: 'settings', title: 'App Settings' };</script>
<script src="assets/shell.js"></script>
<script>
(function () {
  var I = Shell.icon;
  document.getElementById('ki').innerHTML = I('lock');
  document.querySelectorAll('[data-i]').forEach(function (el) { el.innerHTML = I(el.dataset.i) + (el.textContent || ''); });
  document.getElementById('head').innerHTML = Shell.ui.pageHeader({ title: 'App Settings', subtitle: 'Your preferences for this console.' });

  // theme segmented control bound to the shared store
  var cur = Shell.store.get('theme');
  document.querySelectorAll('#theme [data-th]').forEach(function (b) {
    b.setAttribute('aria-selected', b.dataset.th === cur);
    b.addEventListener('click', function () {
      document.querySelectorAll('#theme [data-th]').forEach(function (x) { x.setAttribute('aria-selected', x === b); });
      if (b.dataset.th !== 'system') Shell.store.set({ theme: b.dataset.th });
      else { var sys = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; Shell.store.set({ theme: sys }); }
    });
  });

  var NOTIF = [
    ['Drift detected', 'When live config diverges from published', true],
    ['Validation failures', 'When a rule fails validation', true],
    ['Certificate expiry', 'When a cert expires within 30 days', true],
    ['Publish events', 'When anyone publishes to an environment', false],
  ];
  document.getElementById('notif').innerHTML = NOTIF.map(function (n, i) {
    return '<div class="flex items-center justify-between ' + (i ? 'border-t border-border pt-3' : '') + '"><div><p class="text-[13px] font-medium">' + n[0] + '</p><p class="text-[12px] text-muted-foreground">' + n[1] + '</p></div><button class="switch" role="switch" aria-checked="' + n[2] + '"></button></div>';
  }).join('');

  document.querySelectorAll('.switch').forEach(function (sw) { sw.addEventListener('click', function () { sw.setAttribute('aria-checked', sw.getAttribute('aria-checked') !== 'true'); }); });
  document.querySelectorAll('.seg button:not([data-th])').forEach(function (b) { b.addEventListener('click', function () { b.parentElement.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-selected', x === b); }); }); });
  document.getElementById('save').addEventListener('click', function () { Shell.toast({ title: 'Settings saved', tone: 'success' }); });
  document.getElementById('logout').addEventListener('click', function () { Shell.confirm({ title: 'Sign out?', subtitle: 'You will be redirected to the Keycloak sign-in page.', icon: 'logout', okText: 'Sign out', tone: 'destructive', onConfirm: function () { Shell.toast({ title: 'Signing out…', tone: 'info' }); } }); });
})();
</script>
</body>
</html>
