<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Environments · Trino-Secure</title>
<script>document.documentElement.classList.toggle('dark',(localStorage.getItem('ts-theme')||'dark')==='dark');</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tw.js"></script>
<link rel="stylesheet" href="assets/theme.css" />
</head>
<body>
<template id="page">
  <div class="mx-auto max-w-[1100px] px-4 py-6 md:px-6 md:py-8">
    <div id="head"></div>
    <div class="mt-6 space-y-4" id="list"></div>
  </div>
</template>
<script>window.PAGE = { id: 'envs', title: 'Environments' };</script>
<script src="assets/shell.js"></script>
<script>
(function () {
  var I = Shell.icon;
  document.getElementById('head').innerHTML = Shell.ui.pageHeader({ title: 'Environments', subtitle: 'Trino clusters this console manages. Each has its own delivery mode and refresh policy.',
    actions: Shell.ui.button({ variant: 'primary', size: 'sm', icon: 'plus', label: 'Add environment', attrs: ' id="add"' }) });

  var ENVS = [
    { name: 'Production', host: 'trino.prod.internal', tone: 'destructive', mode: 'HTTP-served', target: 'https://trino.prod.internal:8443/v1/security/rules', refresh: '30s', rules: 84, status: 'Drift detected', sb: 'warning', primary: true },
    { name: 'Staging', host: 'trino.stg.internal', tone: 'warning', mode: 'File-write', target: '/etc/trino/rules.json', refresh: '1m', rules: 80, status: 'In sync', sb: 'success' },
    { name: 'Development', host: 'trino.dev.internal', tone: 'info', mode: 'File-write', target: '/etc/trino/rules.json', refresh: '5m', rules: 61, status: 'In sync', sb: 'success' },
  ];
  function render() {
    document.getElementById('list').innerHTML = ENVS.map(function (e, i) {
      return '<div class="card p-5">' +
        '<div class="flex flex-col gap-4 sm:flex-row sm:items-center">' +
          '<div class="flex items-center gap-3"><span class="flex h-10 w-10 items-center justify-center rounded-lg bg-' + e.tone + '/12 text-' + e.tone + ' [&>svg]:w-5 [&>svg]:h-5">' + I('server') + '</span>' +
            '<div><div class="flex items-center gap-2"><span class="text-[15px] font-semibold">' + e.name + '</span>' + (e.primary ? '<span class="badge badge-primary">primary</span>' : '') + '<span class="badge badge-' + e.sb + '">' + e.status + '</span></div><div class="text-[12px] text-muted-foreground mono">' + e.host + '</div></div></div>' +
          '<div class="ml-auto flex items-center gap-1"><button class="btn btn-ghost btn-icon btn-sm" data-edit="' + i + '">' + I('edit', 'w-4 h-4') + '</button><button class="btn btn-ghost btn-icon btn-sm text-destructive" data-del="' + i + '">' + I('trash', 'w-4 h-4') + '</button></div>' +
        '</div>' +
        '<dl class="mt-4 grid grid-cols-2 gap-x-6 gap-y-3 border-t border-border pt-4 text-[13px] sm:grid-cols-4">' +
          '<div><dt class="text-[11px] text-muted-foreground uppercase tracking-wide">Delivery mode</dt><dd class="mt-0.5 font-medium">' + e.mode + '</dd></div>' +
          '<div class="col-span-2 sm:col-span-1 min-w-0"><dt class="text-[11px] text-muted-foreground uppercase tracking-wide">Target</dt><dd class="mt-0.5 font-medium mono text-[12px] truncate">' + e.target + '</dd></div>' +
          '<div><dt class="text-[11px] text-muted-foreground uppercase tracking-wide">Refresh</dt><dd class="mt-0.5 font-medium">' + e.refresh + '</dd></div>' +
          '<div><dt class="text-[11px] text-muted-foreground uppercase tracking-wide">Active rules</dt><dd class="mt-0.5 font-medium tabular">' + e.rules + '</dd></div>' +
        '</dl></div>';
    }).join('');
    document.querySelectorAll('[data-edit]').forEach(function (b) { b.addEventListener('click', function () { editEnv(ENVS[+b.dataset.edit]); }); });
    document.querySelectorAll('[data-del]').forEach(function (b) { b.addEventListener('click', function () { var e = ENVS[+b.dataset.del]; Shell.confirm({ title: 'Remove ' + e.name + '?', subtitle: 'The console will stop managing <b>' + e.host + '</b>. The cluster config is not changed.', okText: 'Remove environment', onConfirm: function () { Shell.toast({ title: 'Environment removed', tone: 'destructive' }); } }); }); });
  }
  render();
  function editEnv(e) {
    e = e || { name: '', host: '', mode: 'File-write', target: '', refresh: '1m' };
    Shell.drawer({ title: e.name || 'New environment', subtitle: 'Cluster connection & delivery', width: 540,
      body: '<div class="space-y-4">' +
        Shell.ui.field({ label: 'Name', control: '<input class="input" value="' + e.name + '" placeholder="e.g. Production" />' }) +
        Shell.ui.field({ label: 'Host', control: '<input class="input mono" value="' + e.host + '" placeholder="trino.prod.internal" />' }) +
        Shell.ui.field({ label: 'Delivery mode', control: '<div class="seg w-full"><button aria-selected="' + (e.mode === 'HTTP-served') + '" class="flex-1">HTTP-served</button><button aria-selected="' + (e.mode === 'File-write') + '" class="flex-1">File-write</button></div>', hint: 'HTTP-served allows zero-downtime publish & instant rollback.' }) +
        Shell.ui.field({ label: 'Target', control: '<input class="input mono" value="' + e.target + '" placeholder="/etc/trino/rules.json" />' }) +
        Shell.ui.field({ label: 'Refresh period', control: '<select class="input"><option>30s</option><option>1m</option><option>5m</option></select>' }) +
        Shell.ui.field({ label: 'Environment color', control: '<div class="flex gap-2">' + ['destructive', 'warning', 'info', 'success', 'primary'].map(function (t, i) { return '<button class="h-8 w-8 rounded-md bg-' + t + ' ' + (i === 0 ? 'ring-2 ring-offset-2 ring-offset-card ring-' + t : '') + '"></button>'; }).join('') + '</div>' }) + '</div>',
      footer: '<button class="btn btn-ghost mr-auto" data-test>' + I('play', 'w-4 h-4') + 'Test</button><button class="btn btn-outline" data-cancel>Cancel</button><button class="btn btn-primary" data-save>Save</button>',
      onMount: function (d, close) { d.querySelectorAll('.seg button').forEach(function (b) { b.addEventListener('click', function () { d.querySelectorAll('.seg button').forEach(function (x) { x.setAttribute('aria-selected', x === b); }); }); }); d.querySelector('[data-cancel]').addEventListener('click', close); d.querySelector('[data-test]').addEventListener('click', function () { Shell.toast({ title: 'Connection OK', desc: 'Reachable · 84 rules loaded', tone: 'success' }); }); d.querySelector('[data-save]').addEventListener('click', function () { close(); Shell.toast({ title: 'Environment saved', tone: 'success' }); }); } });
  }
  document.getElementById('add').addEventListener('click', function () { editEnv(null); });
})();
</script>
</body>
</html>
