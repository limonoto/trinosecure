<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Effective Permissions · Trino-Secure</title>
<script>document.documentElement.classList.toggle('dark',(localStorage.getItem('ts-theme')||'dark')==='dark');</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tw.js"></script>
<link rel="stylesheet" href="assets/theme.css" />
</head>
<body>
<template id="page">
  <div class="mx-auto max-w-[1080px] px-4 py-6 md:px-6 md:py-8">
    <div id="head"></div>
    <p class="mt-4 text-[13px] text-muted-foreground">Resolve what a principal can actually reach after all rules, group memberships, masks, and row filters are applied.</p>

    <div class="card mt-5 p-4">
      <div class="flex flex-col gap-3 sm:flex-row sm:items-end">
        <div class="flex-1 space-y-1.5"><label class="label">Username or principal</label>
          <div class="relative"><span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground [&>svg]:w-4 [&>svg]:h-4" id="ui"></span><input id="user" class="input pl-9 mono" value="marco.vidal" /></div></div>
        <div class="space-y-1.5"><label class="label">Catalog</label><select id="cat" class="input"><option>All catalogs</option><option>transactions</option><option>pii</option><option>ledger</option></select></div>
        <button class="btn btn-primary" id="resolve" data-i="tree">Resolve access</button>
      </div>
      <div class="mt-3 flex flex-wrap items-center gap-2 text-[12px] text-muted-foreground">Quick:
        <button class="badge badge-neutral hover:bg-muted" data-q="ava.reyes">ava.reyes</button>
        <button class="badge badge-neutral hover:bg-muted" data-q="analyst.intern">analyst.intern</button>
        <button class="badge badge-neutral hover:bg-muted" data-q="svc_etl">svc_etl</button>
      </div>
    </div>

    <!-- resolved identity -->
    <div class="mt-5 grid grid-cols-1 gap-5 lg:grid-cols-[300px_1fr]">
      <aside class="card h-fit p-4">
        <div class="flex items-center gap-3"><span class="flex h-11 w-11 items-center justify-center rounded-full bg-primary/12 text-primary text-sm font-semibold" id="avatar">MV</span><div><div class="font-semibold text-[14px] mono" id="uname">marco.vidal</div><div class="text-[12px] text-muted-foreground">resolved via OIDC</div></div></div>
        <div class="mt-4"><p class="eyebrow mb-2">Groups</p><div class="flex flex-wrap gap-1.5" id="grps"></div></div>
        <div class="mt-4 border-t border-border pt-4 grid grid-cols-2 gap-3 text-center">
          <div><div class="text-xl font-semibold tabular text-success" id="nallow">—</div><div class="text-[11px] text-muted-foreground">reachable tables</div></div>
          <div><div class="text-xl font-semibold tabular text-muted-foreground" id="nmask">—</div><div class="text-[11px] text-muted-foreground">masked columns</div></div>
        </div>
      </aside>

      <section class="card overflow-hidden">
        <div class="flex items-center justify-between border-b border-border px-4 py-3"><h2 class="text-sm font-semibold">Access tree</h2><div class="flex items-center gap-2 text-[11px] text-muted-foreground"><span class="flex items-center gap-1"><span class="dot bg-success"></span>allowed</span><span class="flex items-center gap-1"><span class="dot bg-destructive"></span>denied</span><span class="flex items-center gap-1"><span class="dot bg-info"></span>masked/filtered</span></div></div>
        <div id="tree" class="p-3"></div>
      </section>
    </div>
  </div>
</template>
<script>window.PAGE = { id: 'effective', title: 'Effective Permissions' };</script>
<script src="assets/shell.js"></script>
<script>
(function () {
  var I = Shell.icon;
  document.getElementById('ui').innerHTML = I('search');
  document.querySelectorAll('[data-i]').forEach(function (el) { el.innerHTML = I(el.dataset.i) + (el.textContent || ''); });
  document.getElementById('head').innerHTML = Shell.ui.pageHeader({ title: 'Effective Permissions' });

  var PROFILES = {
    'marco.vidal': { init: 'MV', groups: ['compliance', 'analysts'], allow: 14, mask: 3 },
    'ava.reyes': { init: 'AR', groups: ['platform-admins'], allow: 'ALL', mask: 0 },
    'analyst.intern': { init: 'AI', groups: ['contractors'], allow: 2, mask: 1 },
    'svc_etl': { init: 'SE', groups: ['service-etl'], allow: 8, mask: 0 },
  };
  var TREE = [
    { cat: 'transactions', schemas: [
      { s: 'gold', tables: [{ t: 'payments', a: 'allow', p: 'SELECT', note: '1 mask · row filter' }, { t: 'refunds', a: 'allow', p: 'SELECT' }] },
      { s: 'raw', tables: [{ t: 'card_swipes', a: 'deny' }] },
    ]},
    { cat: 'pii', schemas: [
      { s: 'restricted', tables: [{ t: 'customers', a: 'mask', p: 'SELECT', note: 'ssn, email, phone masked' }] },
    ]},
    { cat: 'ledger', schemas: [
      { s: 'gold', tables: [{ t: 'balances', a: 'deny' }, { t: 'journal', a: 'deny' }] },
    ]},
    { cat: 'analytics', schemas: [
      { s: 'public', tables: [{ t: 'daily_kpis', a: 'allow', p: 'SELECT' }, { t: 'cohorts', a: 'allow', p: 'SELECT' }] },
    ]},
  ];
  var dotc = { allow: 'success', deny: 'destructive', mask: 'info' };

  function resolve(name) {
    var p = PROFILES[name] || PROFILES['marco.vidal'];
    document.getElementById('uname').textContent = name;
    document.getElementById('avatar').textContent = p.init;
    document.getElementById('grps').innerHTML = p.groups.map(function (g) { return '<a href="groups.html" class="badge badge-primary">' + g + '</a>'; }).join('');
    document.getElementById('nallow').textContent = p.allow;
    document.getElementById('nmask').textContent = p.mask;
    document.getElementById('tree').innerHTML = TREE.map(function (c) {
      return '<details open class="group"><summary class="flex cursor-pointer items-center gap-2 rounded-md px-2 py-1.5 hover:bg-muted/50 list-none">' +
          '<span class="text-muted-foreground transition-transform group-open:rotate-90 [&>svg]:w-4 [&>svg]:h-4">' + I('chevronr') + '</span>' +
          '<span class="[&>svg]:w-4 [&>svg]:h-4 text-muted-foreground">' + I('backend') + '</span><span class="mono text-[13px] font-medium">' + c.cat + '</span></summary>' +
        '<div class="ml-4 border-l border-border pl-3 mt-0.5 space-y-0.5">' + c.schemas.map(function (sc) {
          return '<details open class="group/s"><summary class="flex cursor-pointer items-center gap-2 rounded-md px-2 py-1 hover:bg-muted/50 list-none"><span class="text-muted-foreground transition-transform group-open/s:rotate-90 [&>svg]:w-3.5 [&>svg]:h-3.5">' + I('chevronr') + '</span><span class="mono text-[12px] text-muted-foreground">' + sc.s + '</span></summary>' +
            '<div class="ml-4 border-l border-border pl-3 space-y-0.5">' + sc.tables.map(function (tb) {
              return '<div class="flex items-center gap-2 rounded-md px-2 py-1.5 hover:bg-muted/40"><span class="dot bg-' + dotc[tb.a] + '"></span><span class="mono text-[13px] flex-1">' + tb.t + '</span>' +
                (tb.a === 'deny' ? '<span class="badge badge-destructive">' + I('x') + 'No access</span>' : '<span class="badge badge-' + (tb.a === 'mask' ? 'info' : 'neutral') + '">' + (tb.p || '') + '</span>') +
                (tb.note ? '<span class="text-[11px] text-info">' + tb.note + '</span>' : '') + '</div>';
            }).join('') + '</div></details>';
        }).join('') + '</div></details>';
    }).join('');
  }
  resolve('marco.vidal');
  document.getElementById('resolve').addEventListener('click', function () { var b = this; b.disabled = true; b.innerHTML = I('history', 'w-4 h-4 animate-spin') + 'Resolving…'; setTimeout(function () { b.disabled = false; b.innerHTML = I('tree', 'w-4 h-4') + 'Resolve access'; resolve(document.getElementById('user').value.trim()); }, 700); });
  document.querySelectorAll('[data-q]').forEach(function (b) { b.addEventListener('click', function () { document.getElementById('user').value = b.dataset.q; resolve(b.dataset.q); }); });
})();
</script>
</body>
</html>
