<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Password File Users · Trino-Secure</title>
<script>document.documentElement.classList.toggle('dark',(localStorage.getItem('ts-theme')||'dark')==='dark');</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tw.js"></script>
<link rel="stylesheet" href="assets/theme.css" />
</head>
<body>
<template id="page">
  <div class="mx-auto max-w-[1100px] px-4 py-6 md:px-6 md:py-8">
    <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <h1 class="text-2xl font-semibold tracking-tight">Password File Users</h1>
        <p class="mt-1 text-sm text-muted-foreground">Local accounts for the Password authentication method · stored bcrypt-hashed in <span class="mono">password.db</span>.</p>
      </div>
      <button class="btn btn-primary btn-sm" id="add" data-i="plus">Add user</button>
    </div>

    <div class="mt-6 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
      <div class="relative max-w-xs flex-1"><span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground [&>svg]:w-4 [&>svg]:h-4" data-i="search"></span><input id="search" class="input pl-9" placeholder="Search users…" /></div>
      <p class="text-[13px] text-muted-foreground"><span class="font-medium text-foreground" id="ucount">14</span> local users</p>
    </div>

    <div class="card mt-3 overflow-hidden">
      <div class="overflow-x-auto"><table class="tbl min-w-[720px]">
        <thead><tr><th>User</th><th class="w-40">Algorithm</th><th class="w-44">Last set</th><th class="w-24">Status</th><th class="w-28"></th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
    </div>
  </div>
</template>
<script>window.PAGE = { id: 'pwusers', title: 'Password File Users' };</script>
<script src="assets/shell.js"></script>
<script>
(function () {
  var I = Shell.icon;
  document.querySelectorAll('[data-i]').forEach(function (el) { el.innerHTML = I(el.dataset.i) + (el.textContent || ''); });
  var USERS = [
    { u: 'svc_etl', algo: 'bcrypt', set: 'Mar 2, 2026', status: 'Active', svc: true },
    { u: 'svc_reporting', algo: 'bcrypt', set: 'Mar 2, 2026', status: 'Active', svc: true },
    { u: 'svc_backup', algo: 'bcrypt', set: 'Jan 18, 2026', status: 'Active', svc: true },
    { u: 'ava.reyes', algo: 'bcrypt', set: 'May 30, 2026', status: 'Active' },
    { u: 'marco.vidal', algo: 'bcrypt', set: 'Apr 11, 2026', status: 'Active' },
    { u: 'audit_readonly', algo: 'bcrypt', set: 'Dec 1, 2025', status: 'Expired', svc: true },
    { u: 'priya.nair', algo: 'bcrypt', set: 'May 2, 2026', status: 'Active' },
  ];
  var tbody = document.getElementById('rows');
  function render(q) {
    q = (q || '').toLowerCase();
    tbody.innerHTML = USERS.filter(function (u) { return u.u.indexOf(q) > -1; }).map(function (u) {
      return '<tr class="row-hover group"><td><div class="flex items-center gap-2.5"><span class="flex h-7 w-7 items-center justify-center rounded-full ' + (u.svc ? 'bg-muted text-muted-foreground' : 'bg-primary/12 text-primary') + ' [&>svg]:w-4 [&>svg]:h-4">' + I(u.svc ? 'backend' : 'userpass') + '</span><span class="font-medium mono text-[13px]">' + u.u + '</span>' + (u.svc ? '<span class="badge badge-neutral">service</span>' : '') + '</div></td>' +
        '<td><span class="mono text-[12px] text-muted-foreground">' + u.algo + '</span></td>' +
        '<td class="text-[13px] text-muted-foreground">' + u.set + '</td>' +
        '<td>' + Shell.badge(u.status) + '</td>' +
        '<td><div class="flex items-center justify-end gap-0.5 opacity-60 group-hover:opacity-100"><button class="btn btn-ghost btn-sm" data-pw="' + u.u + '">' + I('key', 'w-4 h-4') + 'Set password</button><button class="btn btn-ghost btn-icon btn-sm text-destructive" data-del="' + u.u + '">' + I('trash', 'w-4 h-4') + '</button></div></td></tr>';
    }).join('');
    tbody.querySelectorAll('[data-pw]').forEach(function (b) { b.addEventListener('click', function () { pwModal(b.dataset.pw); }); });
    tbody.querySelectorAll('[data-del]').forEach(function (b) { b.addEventListener('click', function () { Shell.confirm({ title: 'Remove ' + b.dataset.del + '?', subtitle: 'This local account will no longer be able to authenticate.', okText: 'Remove user', onConfirm: function () { Shell.toast({ title: 'User removed', tone: 'destructive' }); } }); }); });
  }
  render();
  document.getElementById('search').addEventListener('input', function (e) { render(e.target.value); });

  function pwModal(u, isNew) {
    Shell.modal({ title: isNew ? 'Add user' : 'Set password', subtitle: isNew ? 'Create a local password-file account' : u, icon: 'key', tone: 'primary', width: 460,
      body: '<div class="space-y-4">' + (isNew ? '<div class="space-y-1.5"><label class="label">Username</label><input id="nu" class="input mono" placeholder="e.g. svc_dashboard" /></div>' : '') +
        '<div class="space-y-1.5"><label class="label">New password</label><input class="input mono" type="password" placeholder="••••••••" /></div>' +
        '<div class="space-y-1.5"><label class="label">Confirm password</label><input class="input mono" type="password" placeholder="••••••••" /></div>' +
        '<div class="rounded-md bg-muted/50 p-3 text-[12px] text-muted-foreground flex gap-2"><span class="[&>svg]:w-4 [&>svg]:h-4 flex-none mt-0.5">' + I('lock') + '</span>Stored as a bcrypt hash. The plaintext is never persisted or logged.</div>' +
        '<div class="flex items-center gap-2"><div class="h-1.5 flex-1 rounded-full bg-muted overflow-hidden"><div class="h-full w-2/3 rounded-full bg-warning"></div></div><span class="text-[12px] text-warning font-medium">Fair</span></div></div>',
      footer: '<button class="btn btn-outline" data-cancel>Cancel</button><button class="btn btn-primary" data-ok>' + (isNew ? 'Create user' : 'Update password') + '</button>',
      onMount: function (m, close) { m.querySelector('[data-cancel]').addEventListener('click', close); m.querySelector('[data-ok]').addEventListener('click', function () { close(); Shell.toast({ title: isNew ? 'User created' : 'Password updated', tone: 'success' }); }); } });
  }
  document.getElementById('add').addEventListener('click', function () { pwModal('', true); });
})();
</script>
</body>
</html>
