<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Design System · Trino-Secure</title>
<script>document.documentElement.classList.toggle('dark',(localStorage.getItem('ts-theme')||'dark')==='dark');</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tw.js"></script>
<link rel="stylesheet" href="assets/theme.css" />
</head>
<body>
<template id="page">
  <div class="mx-auto max-w-[1080px] px-4 py-6 md:px-6 md:py-8">
    <div id="head"></div>

    <!-- TYPE -->
    <section class="mt-8"><h2 class="eyebrow mb-3">Typography · Geist</h2>
      <div class="card divide-y divide-border">
        <div class="flex items-baseline justify-between p-4"><span class="text-2xl font-semibold tracking-tight">Security overview</span><span class="mono text-[12px] text-muted-foreground">24px / 600 / -0.02em</span></div>
        <div class="flex items-baseline justify-between p-4"><span class="text-base font-semibold">Section heading</span><span class="mono text-[12px] text-muted-foreground">16px / 600</span></div>
        <div class="flex items-baseline justify-between p-4"><span class="text-sm">Body — first-match-wins evaluation</span><span class="mono text-[12px] text-muted-foreground">14px / 400</span></div>
        <div class="flex items-baseline justify-between p-4"><span class="text-[13px] text-muted-foreground">Secondary / helper text</span><span class="mono text-[12px] text-muted-foreground">13px / muted</span></div>
        <div class="flex items-baseline justify-between p-4"><span class="mono text-[13px]">ledger.gold.balances</span><span class="mono text-[12px] text-muted-foreground">Geist Mono · code</span></div>
      </div>
    </section>

    <!-- COLOR -->
    <section class="mt-8"><div class="mb-3 flex items-center justify-between"><h2 class="eyebrow">Color tokens</h2><button class="btn btn-outline btn-sm" id="flip">Toggle light / dark</button></div>
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div class="card p-4"><p class="mb-3 text-[13px] font-semibold">Base &amp; surface</p><div class="grid grid-cols-2 gap-2" id="base"></div></div>
        <div class="card p-4"><p class="mb-3 text-[13px] font-semibold">Semantic</p><div class="grid grid-cols-2 gap-2" id="sem"></div></div>
      </div>
    </section>

    <!-- SPACING / RADIUS -->
    <section class="mt-8"><h2 class="eyebrow mb-3">Radius, elevation &amp; spacing</h2>
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
        <div class="card p-4"><p class="mb-3 text-[13px] font-semibold">Radius</p><div class="flex items-end gap-3" id="radii"></div></div>
        <div class="card p-4"><p class="mb-3 text-[13px] font-semibold">Shadow</p><div class="flex items-center gap-4"><div class="h-12 w-12 rounded-md bg-card shadow-sm border border-border"></div><div class="h-12 w-12 rounded-md bg-card shadow-md border border-border"></div><div class="h-12 w-12 rounded-md bg-card shadow-lg border border-border"></div></div></div>
        <div class="card p-4"><p class="mb-3 text-[13px] font-semibold">Spacing · 4px base</p><div class="space-y-1.5" id="space"></div></div>
      </div>
    </section>

    <!-- COMPONENTS -->
    <section class="mt-8"><h2 class="eyebrow mb-3">Components</h2>
      <div class="grid grid-cols-1 gap-4 lg:grid-cols-2">
        <div class="card p-5"><p class="mb-3 text-[13px] font-semibold">Buttons</p><div class="flex flex-wrap gap-2"><button class="btn btn-primary">Primary</button><button class="btn btn-secondary">Secondary</button><button class="btn btn-outline">Outline</button><button class="btn btn-ghost">Ghost</button><button class="btn btn-destructive">Destructive</button></div><div class="mt-3 flex flex-wrap items-center gap-2"><button class="btn btn-primary btn-sm">Small</button><button class="btn btn-outline btn-lg">Large</button><button class="btn btn-outline btn-icon" id="bi1"></button></div></div>
        <div class="card p-5"><p class="mb-3 text-[13px] font-semibold">Status badges</p><div class="flex flex-wrap gap-2" id="badges"></div></div>
        <div class="card p-5"><p class="mb-3 text-[13px] font-semibold">Form fields</p><div class="space-y-3" id="fields"></div></div>
        <div class="card p-5"><p class="mb-3 text-[13px] font-semibold">Controls</p>
          <div class="flex flex-wrap items-center gap-5">
            <label class="flex items-center gap-2 text-[13px]"><input type="checkbox" class="chk" checked />Checkbox</label>
            <div class="flex items-center gap-2 text-[13px]"><button class="switch" role="switch" aria-checked="true" id="sw"></button>Switch</div>
            <div class="seg" id="seg"><button aria-selected="true">Split</button><button aria-selected="false">Unified</button></div>
          </div>
          <div class="mt-4 flex flex-wrap gap-2"><button class="btn btn-outline btn-sm" id="d1">Drawer</button><button class="btn btn-outline btn-sm" id="d2">Modal</button><button class="btn btn-outline btn-sm" id="d3">Toast</button></div>
        </div>
      </div>
    </section>

    <!-- USAGE -->
    <section class="mt-8"><h2 class="eyebrow mb-3">For developers</h2>
      <div class="card p-5 text-[13px] text-muted-foreground leading-relaxed">
        <p>Every screen loads three shared files and plugs page markup into a <span class="mono">&lt;template id="page"&gt;</span>:</p>
        <div class="mono mt-3 rounded-md border border-border bg-muted/40 p-3 text-[12px] leading-relaxed">&lt;script src="assets/tw.js"&gt;&lt;/script&gt;        <span class="text-muted-foreground">// Tailwind tokens (shadcn names)</span><br>&lt;link href="assets/theme.css"&gt;            <span class="text-muted-foreground">// CSS variables: light + .dark</span><br>&lt;script src="assets/shell.js"&gt;&lt;/script&gt;     <span class="text-muted-foreground">// nav, Store, Shell.* components</span></div>
        <ul class="mt-4 space-y-1.5 list-disc pl-5">
          <li>Color tokens mirror <span class="mono">shadcn/ui</span> (<span class="mono">--background</span>, <span class="mono">--primary</span>, <span class="mono">--muted</span>…) → port to a shadcn theme with no remapping.</li>
          <li><span class="mono">Shell.store</span> is a <span class="mono">createStore</span> with <span class="mono">get / set / subscribe</span> — theme &amp; environment flow through it. Port to React context or Zustand.</li>
          <li><span class="mono">Shell.ui.button / field / stat / pageHeader</span> + <span class="mono">drawer / modal / toast / confirm / dragOrder</span> are the reusable component surface.</li>
        </ul>
      </div>
    </section>
  </div>
</template>
<script>window.PAGE = { id: 'ds', title: 'Design System' };</script>
<script src="assets/shell.js"></script>
<script>
(function () {
  var I = Shell.icon;
  document.getElementById('bi1').innerHTML = I('plus', 'w-4 h-4');
  document.getElementById('head').innerHTML = Shell.ui.pageHeader({ eyebrow: 'Trino-Secure', title: 'Design System', subtitle: 'Tokens, type, spacing and the shared component library powering every screen.' });

  function swatch(name, varName, ring) { return '<div class="flex items-center gap-2.5"><span class="h-9 w-9 flex-none rounded-md border border-border" style="background:hsl(var(' + varName + '))"></span><div class="min-w-0"><div class="text-[12px] font-medium truncate">' + name + '</div><div class="mono text-[11px] text-muted-foreground truncate">' + varName + '</div></div></div>'; }
  document.getElementById('base').innerHTML = [['Background', '--background'], ['Card', '--card'], ['Muted', '--muted'], ['Border', '--border'], ['Foreground', '--foreground'], ['Muted fg', '--muted-foreground']].map(function (s) { return swatch(s[0], s[1]); }).join('');
  document.getElementById('sem').innerHTML = [['Primary', '--primary'], ['Success', '--success'], ['Warning', '--warning'], ['Destructive', '--destructive'], ['Info', '--info'], ['Ring', '--ring']].map(function (s) { return swatch(s[0], s[1]); }).join('');

  document.getElementById('radii').innerHTML = [['sm', 4], ['md', 8], ['lg', 10], ['xl', 16]].map(function (r) { return '<div class="text-center"><div class="h-12 w-12 bg-primary/15 border border-primary/40" style="border-radius:' + r[1] + 'px"></div><div class="mono mt-1 text-[11px] text-muted-foreground">' + r[1] + '</div></div>'; }).join('');
  document.getElementById('space').innerHTML = [1, 2, 3, 4, 6].map(function (n) { return '<div class="flex items-center gap-3"><div class="h-2.5 bg-primary/40 rounded" style="width:' + (n * 4) + 'px"></div><span class="mono text-[11px] text-muted-foreground">' + (n * 4) + 'px</span></div>'; }).join('');

  document.getElementById('badges').innerHTML = ['Draft', 'Valid', 'Invalid', 'Published', 'Drift detected', 'Active', 'Expired'].map(function (k) { return Shell.badge(k); }).join(' ');

  document.getElementById('fields').innerHTML =
    Shell.ui.field({ label: 'Default', control: '<input class="input" placeholder="catalog name" />' }) +
    Shell.ui.field({ label: 'Valid', control: '<input class="input input-warning" value="transactions.gold.*" />', hint: 'Pattern matches 3 tables', state: 'success' }) +
    Shell.ui.field({ label: 'Error', control: '<input class="input input-invalid" value="[a-z_" />', hint: 'Unterminated character class', state: 'error' });

  document.getElementById('sw').addEventListener('click', function () { this.setAttribute('aria-checked', this.getAttribute('aria-checked') !== 'true'); });
  document.getElementById('seg').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; this.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-selected', x === b); }); });
  document.getElementById('flip').addEventListener('click', function () { Shell.store.set({ theme: Shell.store.get('theme') === 'dark' ? 'light' : 'dark' }); });

  document.getElementById('d1').addEventListener('click', function () { Shell.drawer({ title: 'Example drawer', subtitle: 'Right-side sheet', body: '<p class="text-[13px] text-muted-foreground">Drawers host create/edit forms and detail views. Press Esc or click the backdrop to dismiss.</p>', footer: '<button class="btn btn-outline" data-cancel>Cancel</button><button class="btn btn-primary">Save</button>', onMount: function (d, c) { d.querySelector('[data-cancel]').addEventListener('click', c); } }); });
  document.getElementById('d2').addEventListener('click', function () { Shell.confirm({ title: 'Example confirmation', subtitle: 'Destructive actions use a modal with an explicit confirm.', okText: 'Got it', tone: 'warning', icon: 'info' }); });
  document.getElementById('d3').addEventListener('click', function () { Shell.toast({ title: 'Toast notification', desc: 'Auto-dismisses after a few seconds', tone: 'success' }); });
})();
</script>
</body>
</html>
