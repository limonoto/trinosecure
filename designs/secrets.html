<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Secrets · Trino-Secure</title>
<script>document.documentElement.classList.toggle('dark',(localStorage.getItem('ts-theme')||'dark')==='dark');</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tw.js"></script>
<link rel="stylesheet" href="assets/theme.css" />
</head>
<body>
<template id="page">
  <div class="mx-auto max-w-[1100px] px-4 py-6 md:px-6 md:py-8">
    <div id="head"></div>
    <div class="mt-6 card flex items-center gap-3 border-info/40 bg-info/[0.06] p-4">
      <span class="flex h-8 w-8 flex-none items-center justify-center rounded-md bg-info/15 text-info [&>svg]:w-[18px] [&>svg]:h-[18px]" id="ii"></span>
      <p class="text-[13px] text-muted-foreground">Secrets are stored as <span class="mono">${ENV:NAME}</span> references — values live in the coordinator's environment or vault, never in <span class="mono">config.properties</span>. The console only manages the references.</p>
    </div>
    <div class="mt-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
      <div class="relative max-w-xs flex-1"><span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground [&>svg]:w-4 [&>svg]:h-4" id="si"></span><input id="search" class="input pl-9" placeholder="Search secrets…" /></div>
      <p class="text-[13px] text-muted-foreground"><span class="font-medium text-foreground" id="cc">7</span> references · <span class="text-warning font-medium">1 unresolved</span></p>
    </div>
    <div class="mt-3 card overflow-hidden">
      <div class="overflow-x-auto"><table class="tbl min-w-[760px]">
        <thead><tr><th>Reference</th><th>Used by</th><th class="w-40">Value</th><th class="w-28">Status</th><th class="w-10"></th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
    </div>
  </div>
</template>
<script>window.PAGE = { id: 'secrets', title: 'Secrets' };</script>
<script src="assets/shell.js"></script>
<script>
(function () {
  var I = Shell.icon;
  document.getElementById('ii').innerHTML = I('info'); document.getElementById('si').innerHTML = I('search');
  document.getElementById('head').innerHTML = Shell.ui.pageHeader({ title: 'Secrets', subtitle: 'Environment-reference manager for credentials used across security configuration.',
    actions: Shell.ui.button({ variant: 'primary', size: 'sm', icon: 'plus', label: 'Add reference', attrs: ' id="add"' }) });

  var SECRETS = [
    { ref: 'LDAP_BIND_PASSWORD', used: 'LDAP auth', resolved: true },
    { ref: 'OAUTH_CLIENT_SECRET', used: 'OAuth 2.0', resolved: true },
    { ref: 'KEYSTORE_PASSWORD', used: 'TLS / HTTPS', resolved: true },
    { ref: 'TRUSTSTORE_PASSWORD', used: 'LDAP truststore', resolved: true },
    { ref: 'RANGER_ADMIN_TOKEN', used: 'Access control backend', resolved: false },
    { ref: 'PASSWORD_DB_KEY', used: 'Password file', resolved: true },
    { ref: 'JWT_SHARED_SECRET', used: 'JWT auth (disabled)', resolved: true },
  ];
  var tbody = document.getElementById('rows');
  function render(q) {
    q = (q || '').toLowerCase();
    tbody.innerHTML = SECRETS.filter(function (s) { return s.ref.toLowerCase().indexOf(q) > -1; }).map(function (s) {
      return '<tr class="row-hover group"><td><div class="flex items-center gap-2.5"><span class="flex h-7 w-7 items-center justify-center rounded-md bg-muted text-muted-foreground [&>svg]:w-4 [&>svg]:h-4">' + I('secret') + '</span><span class="mono text-[13px] font-medium">${ENV:' + s.ref + '}</span></div></td>' +
        '<td class="text-[13px] text-muted-foreground">' + s.used + '</td>' +
        '<td><span class="mono text-[13px] text-muted-foreground tracking-widest">••••••••</span></td>' +
        '<td>' + (s.resolved ? '<span class="badge badge-success">' + I('checkcircle') + 'Resolved</span>' : '<span class="badge badge-warning">' + I('alert') + 'Unresolved</span>') + '</td>' +
        '<td><div class="flex items-center justify-end gap-0.5 opacity-60 group-hover:opacity-100"><button class="btn btn-ghost btn-icon btn-sm" data-edit="' + s.ref + '">' + I('edit', 'w-4 h-4') + '</button><button class="btn btn-ghost btn-icon btn-sm text-destructive" data-del="' + s.ref + '">' + I('trash', 'w-4 h-4') + '</button></div></td></tr>';
    }).join('');
    tbody.querySelectorAll('[data-edit]').forEach(function (b) { b.addEventListener('click', function () { edit(b.dataset.edit); }); });
    tbody.querySelectorAll('[data-del]').forEach(function (b) { b.addEventListener('click', function () { Shell.confirm({ title: 'Delete reference?', subtitle: '<span class="mono">${ENV:' + b.dataset.del + '}</span> is used in active config. Removing it may break authentication.', okText: 'Delete', onConfirm: function () { Shell.toast({ title: 'Reference deleted', tone: 'destructive' }); } }); }); });
  }
  render();
  document.getElementById('search').addEventListener('input', function (e) { render(e.target.value); });
  function edit(ref) {
    Shell.modal({ title: ref ? 'Edit reference' : 'Add reference', icon: 'secret', tone: 'primary', width: 460, subtitle: 'Bind a name to an environment variable or vault path',
      body: '<div class="space-y-4">' + Shell.ui.field({ label: 'Reference name', control: '<input class="input mono" value="' + (ref || '') + '" placeholder="MY_SECRET" />' }) +
        Shell.ui.field({ label: 'Source', control: '<div class="seg w-full"><button aria-selected="true" class="flex-1">Environment var</button><button aria-selected="false" class="flex-1">Vault path</button></div>' }) +
        Shell.ui.field({ label: 'Resolves from', control: '<input class="input mono" placeholder="${ENV:' + (ref || 'MY_SECRET') + '}" />', hint: 'The console never reads or stores the value.', state: 'success' }) + '</div>',
      footer: '<button class="btn btn-outline" data-cancel>Cancel</button><button class="btn btn-primary" data-ok>Save</button>',
      onMount: function (m, close) { m.querySelectorAll('.seg button').forEach(function (b) { b.addEventListener('click', function () { m.querySelectorAll('.seg button').forEach(function (x) { x.setAttribute('aria-selected', x === b); }); }); }); m.querySelector('[data-cancel]').addEventListener('click', close); m.querySelector('[data-ok]').addEventListener('click', function () { close(); Shell.toast({ title: 'Reference saved', tone: 'success' }); }); } });
  }
  document.getElementById('add').addEventListener('click', function () { edit(''); });
})();
</script>
</body>
</html>
